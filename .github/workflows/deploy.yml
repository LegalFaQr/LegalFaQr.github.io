name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # actions/checkout@v4.2.2 — pinned to SHA (VUL-003)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683

      - name: Set up Node
        # actions/setup-node@v4.1.0 — pinned to SHA (VUL-003)
        uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        # npm ci enforces package-lock.json exactly — prevents supply chain drift (VUL-002)
        run: npm ci

      - name: Build
        run: npm run build

      - name: Upload artifact
        # actions/upload-pages-artifact@v3.0.1 — pinned to SHA (VUL-003)
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: ./dist

      - name: Deploy to GitHub Pages
        id: deployment
        # actions/deploy-pages@v4.0.5 — pinned to SHA (VUL-003)
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e

